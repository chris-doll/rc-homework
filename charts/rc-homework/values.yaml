# Default values for rc-homework.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nginx
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.21" #changed this from 1.21-latest because this tag does not exist


resources:
  requests:
    memory: 256Mi #changed from "512Mi" because exceeded memory limit
    cpu: 250m #changed from "500m" because exceeded cpu limit 
  limits:
    memory: 256Mi
    cpu: 250m

service:
  type: ClusterIP
  sourcePort: 8080 #changed from "port" because value for spec.ports.port was calling for "sourcePort" and not "port" in service.yaml - changed to 8080 from 80
  targetPort: 80 #trying out 80 instead of 8080 so that this target port matches the port the container is listening on, which is 80
  protocol: TCP #capitalized to resolve syntax error
